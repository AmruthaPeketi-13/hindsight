<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hindsight | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap');

        body {
            background-color: #131313;
            color: #e5e2e1;
            font-family: 'Geist', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(192, 193, 255, 0.4);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15);
        }

        .btn-3d {
            background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 0 0 #3730a3;
        }

        .btn-3d:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .btn-3d:active {
            box-shadow: 0 2px 0 0 #3730a3;
            transform: translateY(2px);
        }

        .glowing-text {
            text-shadow: 0 0 15px rgba(192, 193, 255, 0.5);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {colors: {"surface-container-lowest": "#0e0e0e", "outline-variant": "#464554", "primary-fixed-dim": "#c1c1ff", "surface-variant": "#353534", "on-primary": "#221f85", "on-secondary-container": "#00424e", "on-error": "#690005", tertiary: "#ffb2b7", "surface-container-low": "#1c1b1b", "on-error-container": "#ffdad6", "on-background": "#e5e2e1", "on-surface-variant": "#c7c4d7", secondary: "#4cd7f6", "tertiary-container": "#ff516a", "surface-bright": "#3a3939", "surface-container-high": "#2a2a2a", background: "#131313", "on-tertiary": "#67001b", "inverse-primary": "#5252b5", "on-primary-container": "#1a157f", "on-surface": "#e5e2e1", "tertiary-fixed-dim": "#ffb2b7", "on-primary-fixed": "#0a006b", surface: "#131313", error: "#ffb4ab", "secondary-fixed-dim": "#4cd7f6", "on-secondary-fixed": "#001f26", primary: "#c1c1ff", "tertiary-fixed": "#ffdadb", "secondary-container": "#03b5d3", "on-tertiary-container": "#5b0017", "inverse-on-surface": "#313030", "on-tertiary-fixed": "#40000d", "primary-container": "#8586ec", "inverse-surface": "#e5e2e1", "on-secondary": "#003640", "surface-container-highest": "#353534", "on-secondary-fixed-variant": "#004e5c", "surface-container": "#201f1f", "surface-tint": "#c1c1ff", outline: "#908fa0", "secondary-fixed": "#acedff", "primary-fixed": "#e2dfff", "on-primary-fixed-variant": "#3a399c", "error-container": "#93000a", "on-tertiary-fixed-variant": "#92002a", "surface-dim": "#131313"}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, spacing: {lg: "24px", "container-max": "1440px", sm: "8px", md: "16px", xs: "4px", xl: "40px", base: "4px", gutter: "20px"}, fontFamily: {"body-md": ["Geist"], "headline-xl": ["Geist"], "headline-lg-mobile": ["Geist"], "headline-lg": ["Geist"], "label-mono": ["JetBrains Mono"], "body-sm": ["Geist"], headline: ["Geist"], display: ["Geist"], body: ["Geist"], label: ["Jetbrains Mono"]}, fontSize: {"body-md": ["16px", {lineHeight: "24px", fontWeight: "400"}], "headline-xl": ["48px", {lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "700"}], "headline-lg-mobile": ["24px", {lineHeight: "32px", fontWeight: "600"}], "headline-lg": ["32px", {lineHeight: "40px", letterSpacing: "-0.01em", fontWeight: "600"}], "label-mono": ["12px", {lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "500"}], "body-sm": ["14px", {lineHeight: "20px", fontWeight: "400"}]}}}};</script>
</head>
<body class="bg-surface text-on-surface selection:bg-primary/30">
    
    <!-- Background Shader -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-40 mix-blend-screen">
        <canvas id="bg-canvas" class="w-full h-full"></canvas>
    </div>

    <!-- Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 flex justify-between items-center px-lg py-sm bg-surface/40 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-md cursor-pointer hover:opacity-80 transition-opacity" onclick="window.location.href='/'">
            <span class="material-symbols-outlined text-primary text-3xl">memory</span>
            <span class="font-headline-lg text-headline-lg-mobile font-bold text-primary tracking-tighter glowing-text">Hindsight</span>
        </div>
    </nav>

    <!-- Auth Container -->
    <main class="relative z-10 w-full max-w-sm px-md animate__animated animate__fadeInUp">
        <div class="glass-card p-xl rounded-2xl flex flex-col items-center">
            
            <div class="w-16 h-16 rounded-2xl bg-primary/20 flex items-center justify-center mb-md border border-primary/30 shadow-[0_0_20px_rgba(99,102,241,0.2)]">
                <span class="material-symbols-outlined text-primary text-4xl" id="authIcon">lock</span>
            </div>

            <h2 id="authTitle" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-bold mb-lg text-center">Secure Authentication</h2>
            
            <div id="errorMsg" class="w-full text-error font-body-sm text-center mb-md min-h-[20px]"></div>
            
            <form id="authForm" class="w-full flex flex-col gap-md">
                <div class="flex flex-col gap-xs">
                    <label class="font-label-mono text-label-mono text-outline">USERNAME</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-sm text-outline">person</span>
                        <input type="text" id="username" required autocomplete="username" class="w-full bg-surface-container/50 border border-white/10 rounded-lg py-sm pl-xl pr-md text-on-surface font-body-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="Enter your username">
                    </div>
                </div>
                
                <div class="flex flex-col gap-xs">
                    <label class="font-label-mono text-label-mono text-outline">PASSWORD</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-sm text-outline">key</span>
                        <input type="password" id="password" required autocomplete="current-password" class="w-full bg-surface-container/50 border border-white/10 rounded-lg py-sm pl-xl pr-md text-on-surface font-body-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-outline/50" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-3d w-full py-sm mt-sm rounded-lg font-bold text-on-primary font-body-md flex items-center justify-center gap-sm">
                    Authenticate
                    <span class="material-symbols-outlined text-sm">login</span>
                </button>
            </form>

            <div class="w-full mt-lg pt-md border-t border-white/10 text-center">
                <button id="toggleAuth" class="font-body-sm text-outline hover:text-primary transition-colors focus:outline-none">
                    Create new identity →
                </button>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        // Adjust auth.js visual effects on toggle
        const toggleBtn = document.getElementById('toggleAuth');
        const originalToggleText = toggleBtn.textContent;
        const icon = document.getElementById('authIcon');
        
        // This hooks into the state from auth.js implicitly
        toggleBtn.addEventListener('click', () => {
            setTimeout(() => {
                if (document.getElementById('authTitle').textContent.includes('Login')) {
                    toggleBtn.textContent = 'Create new identity →';
                    icon.textContent = 'lock';
                } else {
                    toggleBtn.textContent = '← Return to Authentication';
                    icon.textContent = 'person_add';
                }
            }, 50); // slight delay to let auth.js update title first
        });

        // Simple background effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let time = 0;
        function animateBg() {
            time += 0.005;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            
            for(let i=0; i<3; i++) {
                const radius = 200 + Math.sin(time + i) * 100;
                const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 2);
                gradient.addColorStop(0, `rgba(99, 102, 241, ${0.1 - i*0.02})`);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            requestAnimationFrame(animateBg);
        }
        animateBg();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
